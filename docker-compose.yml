services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app

    container_name: bengkelSepedaMotor_app
    restart: unless-stopped
    working_dir: /var/www/html

    deploy:
      resources:
        limits:
          memory: 256M

    volumes:
      - .:/var/www/html
      - /var/www/html/public/build
      - /var/www/html/vendor
      - storage_data:/var/www/html/storage

    environment:
      HOME: /tmp
      APP_ENV: production
      APP_DEBUG: false

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

    networks:
      - laravel

    depends_on:
      db:
        condition: service_healthy


  nginx:
    image: nginx:alpine

    container_name: bengkelSepedaMotor_nginx
    restart: unless-stopped

    deploy:
      resources:
        limits:
          memory: 64M

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - .:/var/www/html:ro
      - /var/www/html/public/build
      - /var/www/html/vendor:ro 
      - storage_data:/var/www/html/storage:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro 

    networks:
      - laravel

    depends_on:
      - app


  db:
    image: mysql:8.4

    container_name: bengkelSepedaMotor_db
    restart: unless-stopped

    deploy:
      resources:
        limits:
          memory: 384M

    command:
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=64M
      - --innodb-log-buffer-size=1M
      - --max-connections=30
      - --key-buffer-size=8M
      - --thread-stack=128K
      - --table-open-cache=200
      - --sort-buffer-size=256K
      - --read-buffer-size=128K
      - --read-rnd-buffer-size=256K

    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}

    volumes:
      - db_data:/var/lib/mysql

    networks:
      - laravel

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${DB_ROOT_PASSWORD}"
        ]
      interval: 10s
      timeout: 5s
      retries: 3


networks:
  laravel:
    driver: bridge


volumes:
  db_data:
  storage_data: