services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    container_name: nirwanaGarage_app
    restart: unless-stopped
    working_dir: /var/www/html

    # deploy.resources.limits HANYA berlaku di Swarm mode.
    # Untuk `docker compose up` biasa, pakai mem_limit/mem_reservation.
    mem_limit: 256m
    mem_reservation: 128m

    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/public/build
      - storage_data:/var/www/html/storage

    env_file:
      - .env

    environment:
      HOME: /tmp
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

    healthcheck:
      test: ["CMD", "php-fpm-healthcheck"]
      # Kalau image belum punya php-fpm-healthcheck, ganti dengan cek socket:
      # test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - laravel

    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: nirwanaGarage_nginx
    restart: unless-stopped

    mem_limit: 64m

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Nginx cukup butuh public/, bukan seluruh project (jangan expose .env & source code)
      - ./public:/var/www/html/public:ro
      - storage_data:/var/www/html/storage:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro

    networks:
      - laravel

    depends_on:
      app:
        condition: service_healthy

  db:
    image: mysql:8.4
    container_name: nirwanaGarage_db
    restart: unless-stopped

    mem_limit: 384m

    command:
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=64M
      - --innodb-log-buffer-size=1M
      - --max-connections=30
      - --key-buffer-size=8M
      - --thread-stack=128K
      - --table-open-cache=200
      - --sort-buffer-size=256K
      - --read-buffer-size=128K
      - --read-rnd-buffer-size=256K

    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}

    volumes:
      - db_data:/var/lib/mysql

    networks:
      - laravel

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${DB_ROOT_PASSWORD}"
        ]
      interval: 10s
      timeout: 5s
      retries: 3


networks:
  laravel:
    driver: bridge


volumes:
  db_data:
  storage_data: