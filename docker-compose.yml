services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
      args:
        WWWUSER: ${WWWUSER:-1000}
        WWWGROUP: ${WWWGROUP:-1000}

    container_name: bengkelSepedaMotor_app
    restart: unless-stopped
    working_dir: /var/www/html

    volumes:
      - /var/www/Bengkel-sepeda-motor/.env:/var/www/html/.env:ro
      - storage_data:/var/www/html/storage

    environment:
      HOME: /tmp
      WWWUSER: ${WWWUSER:-1000}
      APP_ENV: production
      APP_DEBUG: false

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

    networks:
      - laravel

    depends_on:
      db:
        condition: service_healthy


  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx

    container_name: bengkelSepedaMotor_nginx
    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - storage_data:/var/www/html/storage:ro

    networks:
      - laravel

    depends_on:
      - app


  db:
    image: mysql:8.4
    container_name: bengkelSepedaMotor_db
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}

    volumes:
      - db_data:/var/lib/mysql

    networks:
      - laravel

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${DB_ROOT_PASSWORD}"
        ]
      interval: 10s
      timeout: 5s
      retries: 3


networks:
  laravel:
    driver: bridge


volumes:
  db_data:
  storage_data: