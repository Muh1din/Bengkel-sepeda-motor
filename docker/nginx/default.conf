server {
    listen 80;
    server_name nirwarna-garage.web.id www.nirwarna-garage.web.id;
    return 301 https://$host$request_uri;

    # Matikan access log agar hemat Disk I/O & CPU, simpan error penting saja
    access_log off;
    error_log /var/log/nginx/error.log crit;

    # Batasi ukuran upload (misal: gambar/foto nota) agar memory tidak melonjak
    client_max_body_size 10M;

    # FastCGI Buffer Optimization (Mencegah Nginx boros RAM saat terima data dari PHP)
    fastcgi_buffers 8 8k;
    fastcgi_buffer_size 16k;

    # Gzip Compression untuk menghemat bandwidth & mempercepat loading frontend
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Main Location Block
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Perbaikan Storage Link Laravel (Menghindari bug alias pada try_files)
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        try_files $uri $uri/ =404;

        # Static file caching untuk menghemat load CPU/RAM server
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Caching untuk Assets (CSS, JS, Fonts, Vite builds)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        access_log off;
        log_not_found off;
    }

    # Blok PHP-FPM Processing
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 60s;
        fastcgi_read_timeout 60s;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}